[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "conda-cli-mcp"
description = "Expose conda and its plugin commands through the Model Context Protocol"
requires-python = ">=3.10"
readme = "README.md"
license = "BSD-3-Clause"
classifiers = [
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = ["anyio>=4.9", "jsonschema>=4.20", "mcp>=2,<3"]
dynamic = ["version"]

[project.urls]
changelog = "https://github.com/jezdez/conda-cli-mcp/blob/main/CHANGELOG.md"
documentation = "https://jezdez.github.io/conda-cli-mcp/"
repository = "https://github.com/jezdez/conda-cli-mcp"

[project.scripts]
conda-cli-mcp = "conda_cli_mcp.cli:main"

[tool.hatch.version]
source = "vcs"

[tool.pytest.ini_options]
addopts = "-ra -v"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
flake8-type-checking = { exempt-modules = [], strict = true }
select = ["E", "F", "FA", "I", "ISC", "RUF100", "T10", "TCH", "UP", "W"]

[tool.ty.environment]
python-version = "3.10"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]

[tool.pixi.dependencies]
python = ">=3.10"
conda = ">=26.7,<27"
anyio = ">=4.9"
jsonschema = ">=4.20"
mcp = ">=2,<3"

[tool.pixi.pypi-dependencies]
conda-cli-mcp = { path = ".", editable = true }

[tool.pixi.feature.dev.dependencies]
ruff = ">=0.9"
ty = ">=0.0.70,<0.1"

[tool.pixi.feature.test.dependencies]
pytest = ">=8"

[tool.pixi.feature.build.dependencies]
rattler-build = ">=0.74"

[tool.pixi.feature.build.tasks]
package = { cmd = "rattler-build build --recipe recipe --output-dir dist --channel conda-forge", description = "Build and test the conda package" }

[tool.pixi.feature.docs.dependencies]
conda-sphinx-theme = ">=0.2"
myst-parser = ">=3.0"
sphinx = ">=7.0"
sphinx-design = ">=0.6"

[tool.pixi.feature.docs.tasks]
docs = { cmd = "sphinx-build -W --keep-going -n -b dirhtml docs docs/_build/dirhtml", description = "Build documentation" }

[tool.pixi.feature.py310.dependencies]
python = "3.10.*"

[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

[tool.pixi.feature.release.dependencies]
hatch-vcs = ">=0.4"
hatchling = ">=1.27"
python = "3.13.*"
python-build = ">=1.2"
twine = ">=6.2"

[tool.pixi.feature.release.tasks]
build-pypi = { cmd = "python -m build --no-isolation", description = "Build the PyPI distributions" }
check-pypi = { cmd = "python -m twine check --strict dist/*", description = "Check the PyPI distributions" }

[tool.pixi.environments]
default = { features = ["dev", "test"], solve-group = "default" }
build = { features = ["build"], solve-group = "build" }
docs = { features = ["docs"], no-default-feature = true }
release = { features = ["release"], no-default-feature = true, platforms = ["linux-64"] }
test-py310 = { features = ["test", "py310"], solve-group = "test-py310" }
test-py314 = { features = ["test", "py314"], solve-group = "test-py314" }

[tool.pixi.tasks]
format = { cmd = "ruff format conda_cli_mcp tests", description = "Format source and tests" }
format-check = { cmd = "ruff format --check conda_cli_mcp tests", description = "Check formatting" }
lint = { cmd = "ruff check conda_cli_mcp tests", description = "Check source and tests" }
typecheck = { cmd = "ty check conda_cli_mcp", description = "Check types" }
test = { cmd = "pytest", description = "Run tests" }

[tool.pixi.tasks.check]
depends-on = ["lint", "format-check", "typecheck"]
description = "Run static checks"
