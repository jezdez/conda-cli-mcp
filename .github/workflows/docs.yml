name: Docs

on:
  push:
    branches:
      - main
    paths:
      - "CHANGELOG.md"
      - ".github/workflows/docs.yml"
      - "conda_cli_mcp/**"
      - "docs/**"
      - "pixi.lock"
      - "pyproject.toml"
  pull_request:
    branches:
      - main
    paths:
      - "CHANGELOG.md"
      - ".github/workflows/docs.yml"
      - "conda_cli_mcp/**"
      - "docs/**"
      - "pixi.lock"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || 'pages' }}
  cancel-in-progress: false

jobs:
  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
        with:
          pixi-version: v0.77.0
          environments: docs
          frozen: true
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: pixi run -e docs docs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/_build/dirhtml

  pages:
    name: Deploy documentation
    if: github.ref == 'refs/heads/main'
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # authenticate the deployment to GitHub Pages
      pages: write # publish the built documentation site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
