name: Publish conda package

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing source release tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-conda-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to jezdez/main
    runs-on: ubuntu-latest
    environment:
      name: anaconda
      url: https://anaconda.org/jezdez/conda-cli-mcp
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
        with:
          environments: build
          pixi-version: v0.77.0
          frozen: true
          cache: true
      - name: Validate release tag
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be a stable numeric version." >&2
            exit 1
          fi
          if [ "$(git describe --tags --exact-match HEAD)" != "$RELEASE_TAG" ]; then
            echo "The checked-out commit does not match the release tag." >&2
            exit 1
          fi
      - name: Build exact package
        run: SETUPTOOLS_SCM_PRETEND_VERSION="$RELEASE_TAG" pixi run --locked -e build package
      - name: Validate unpublished package
        run: |
          set -euo pipefail

          mapfile -t packages < <(find dist/noarch -type f -name '*.conda' -print)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "Expected exactly one noarch conda package." >&2
            exit 1
          fi

          metadata="$(
            pixi run --locked -e build \
              rattler-build package inspect --json "${packages[0]}"
          )"
          jq -e --arg version "$RELEASE_TAG" '
            .index
            | .name == "conda-cli-mcp"
              and .version == $version
              and .build_number == 0
              and .subdir == "noarch"
              and .noarch == "python"
              and .license == "BSD-3-Clause"
          ' <<< "$metadata" >/dev/null

          status="$(
            curl -sS \
              -o /dev/null \
              -w '%{http_code}' \
              "https://api.anaconda.org/release/jezdez/conda-cli-mcp/${RELEASE_TAG}"
          )"
          if [ "$status" != "404" ]; then
            echo "Anaconda.org release already exists or could not be checked." >&2
            exit 1
          fi
      - name: Upload immutable package
        env:
          ANACONDA_API_KEY: ${{ secrets.ANACONDA_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$ANACONDA_API_KEY" ]; then
            echo "The anaconda environment must provide ANACONDA_API_KEY." >&2
            exit 1
          fi
          package="$(find dist/noarch -type f -name '*.conda' -print -quit)"
          pixi upload --no-config anaconda \
            --owner jezdez \
            --channel main \
            "$package"
      - name: Verify indexed package
        run: |
          set -euo pipefail

          package="$(find dist/noarch -type f -name '*.conda' -print -quit)"
          filename="${package##*/}"
          expected_sha256="$(sha256sum "$package" | cut -d ' ' -f 1)"
          expected_size="$(stat -c '%s' "$package")"
          metadata="$(
            pixi run --locked -e build \
              rattler-build package inspect --json "$package"
          )"
          build="$(jq -r '.index.build' <<< "$metadata")"

          for _ in {1..12}; do
            distribution="$(
              curl -fsSL \
                "https://api.anaconda.org/dist/jezdez/conda-cli-mcp/${RELEASE_TAG}/noarch/${filename}"
            )" || true
            repodata="$(
              curl -fsSL https://conda.anaconda.org/jezdez/noarch/repodata.json
            )" || true

            if jq -e \
              --arg basename "noarch/${filename}" \
              --arg build "$build" \
              --arg sha256 "$expected_sha256" \
              --arg version "$RELEASE_TAG" \
              --argjson size "$expected_size" '
                .basename == $basename
                  and .version == $version
                  and .sha256 == $sha256
                  and .size == $size
                  and (.labels | index("main"))
                  and .attrs.build == $build
                  and .attrs.build_number == 0
                  and .attrs.subdir == "noarch"
              ' <<< "$distribution" >/dev/null 2>&1 \
              && jq -e \
                --arg filename "$filename" \
                --arg build "$build" \
                --arg sha256 "$expected_sha256" \
                --arg version "$RELEASE_TAG" \
                --argjson size "$expected_size" '
                  ."packages.conda"[$filename]
                  | .name == "conda-cli-mcp"
                    and .version == $version
                    and .build == $build
                    and .build_number == 0
                    and .subdir == "noarch"
                    and .sha256 == $sha256
                    and .size == $size
                ' <<< "$repodata" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 5
          done

          echo "Published package did not appear in noarch repodata." >&2
          exit 1
